[project]
name = "gaudi-rag-backend"
version = "0.1.0"
description = "RAG backend: ingestion, hybrid retrieval, cited generation over UK architecture PDFs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.2.5",
    "pymupdf>=1.24",
    "anthropic>=0.34",
    "voyageai>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

# NOTE: versions above are floors, not verified latest. Before you commit,
# run `pip install -U` on these and check each provider's current SDK/model docs.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
